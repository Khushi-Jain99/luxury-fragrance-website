<div class="card">
    <div class="card__image">
        <img appImgFallback [src]="product.image" alt="Luxury fragrance product" title="Luxury fragrance product" loading="lazy">
        <button type="button" class="card__wishlist" (click)="onToggleWishlist()" aria-label="Toggle wishlist">
            <svg viewBox="0 0 24 24" aria-hidden="true" [class.active]="wishlist.isInWishlist(product.id)">
                <path d="M12 21.1 10.7 20C5.7 15.6 2.4 12.6 2.4 8.9a4.8 4.8 0 0 1 4.9-4.8c1.7 0 3.3.8 4.3 2.1a5.6 5.6 0 0 1 4.3-2.1 4.8 4.8 0 0 1 4.9 4.8c0 3.7-3.3 6.7-8.3 11.1L12 21.1Z" />
            </svg>
        </button>

        @if (product.bestSeller) {
        <span class="card__badge">Best Seller</span>
        }

        <div class="card__overlay">
            <a [routerLink]="['/product', product.id]" class="btn btn--outline">View Details</a>
            <button type="button" class="btn btn--primary" (click)="onQuickAdd()">Quick Add</button>
        </div>
    </div>
    <div class="card__content">
        <p class="card__meta">{{ product.brand }} | {{ product.family }}</p>
        <h3 class="card__name"><a [routerLink]="['/product', product.id]">{{ product.name }}</a></h3>
        <p class="card__desc">{{ product.description }}</p>
        <div class="card__rating">
            <span class="stars"></span>
            <span class="stars fill" [style.width]="ratingWidth"></span>
            <small>{{ product.rating }} ({{ product.reviews }})</small>
        </div>
        <p class="card__price">{{ product.price | currency:'USD' }}</p>
    </div>
</div>
